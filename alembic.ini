# Alembic configuration.
# The database URL is intentionally left blank: it is injected at runtime from
# `app.core.config.Settings` (i.e. from the DATABASE_URL environment variable)
# inside `alembic/env.py`. Do not hardcode credentials here.

[alembic]
script_location = alembic
prepend_sys_path = .
# Revisions live flat in alembic/versions/ (e.g. 0001_initial.py).

# sqlalchemy.url is set programmatically in alembic/env.py
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
